name: Build

# Every push to main or a v* tag produces a release named <latest vX.Y.Z tag>-<first 10 chars of the commit>,
# e.g. v0.0.1-4b81708844, with an Apple silicon macOS build and x64 Linux builds attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          # Build releases are tagged vX.Y.Z-<hash>; only plain vX.Y.Z tags count as the base version.
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude 'v*-*' 2>/dev/null || echo v0.0.0)
          hash=$(git rev-parse HEAD | cut -c1-10)
          echo "name=$tag-$hash" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}+$hash" >> "$GITHUB_OUTPUT"
          echo "Building $tag-$hash"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac
            runner: macos-latest
            args: --mac --arm64
          - name: linux
            runner: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Package
        env:
          BUILD_NAME: ${{ needs.version.outputs.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx electron-builder ${{ matrix.args }} --publish never
          -c.extraMetadata.version=${{ needs.version.outputs.version }}
          '-c.artifactName=${productName}-${env.BUILD_NAME}-${os}-${arch}.${ext}'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ needs.version.outputs.name }}
        run: |
          ls -la artifacts
          if gh release view "$NAME" >/dev/null 2>&1; then
            gh release upload "$NAME" artifacts/* --clobber
          else
            gh release create "$NAME" artifacts/* --target "$GITHUB_SHA" --title "BetterCodex $NAME" --notes "Built from $GITHUB_SHA."
          fi
